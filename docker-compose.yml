version: '3.8'

services:
  # 1. PostGIS Database
  db:
    image: postgis/postgis:15-3.3
    container_name: terraguard-postgis
    environment:
      POSTGRES_USER: terraguard_admin
      POSTGRES_PASSWORD: terraguard_secure_pass_2026
      POSTGRES_DB: terraguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraguard_admin -d terraguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Async Message Broker
  redis:
    image: redis:7-alpine
    container_name: terraguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. FastAPI Python Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terraguard-backend
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg2://terraguard_admin:terraguard_secure_pass_2026@db:5432/terraguard_db
      SECRET_KEY: terraguard_super_secret_production_key_dikrong_2026
      OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1/forecast
      ENABLE_HECRAS_NATIVE: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. React + Vite + Nginx Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: terraguard-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
